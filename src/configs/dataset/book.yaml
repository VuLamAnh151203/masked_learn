# Common Features
USER_ID_FIELD: userID
ITEM_ID_FIELD: itemID
#RATING_FIELD: rating
TIME_FIELD: timestamp
# Selectively Loading
load_meta_cols: [itemID, description, title, category]
inter_splitting_label: 'x_label'
TEXT_ID_FIELD: description

inter_file_name: 'book.inter'
text_feature_file: 'text_feat.npy'
user_feature_file: 'user_feat.npy'


field_separator: "\t"

# MASKED_GLORIA_MIPD listwise experiment. Other models ignore these fields.
mipd_weight: 0.01
mipd_num_negatives: 32
mipd_num_samples: 3
mipd_temperature: 1.0
mipd_negative_sampling: full_hard
mipd_hard_pool_size: 256

# MASKED_GLORIA_MIPD_KL Full-Masked distribution alignment.
branch_kl_weight: 0
branch_kl_temperature: 1.0
